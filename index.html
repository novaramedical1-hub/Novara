<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المرتجعات والتوالف- NOVARA MEDICAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#f3f6fc;--card:#ffffff;--ink:#0f1b33;--muted:#62708a;--line:#e2e8f3;--navy:#1e3a8a;--blue:#2f5bd8;
  --orange:#e63946;--brand-orange:#f05d23;--green:#16a34a;--green-bg:#e7f8ee;--red:#dc2626;--red-bg:#fdecec;
  --amber:#d97706;--amber-bg:#fff4dc;--sky-bg:#e6f1ff;--input:#ffffff;--th-bg:#1e3a8a;--th-ink:#ffffff;
  --shadow:0 1px 2px rgba(15,27,51,.04),0 8px 24px -8px rgba(15,27,51,.10);--radius:14px;
}
[data-theme="dark"]{
  --bg:#0b1220;--card:#131c2e;--ink:#e8eefc;--muted:#93a1bd;--line:#243049;--navy:#9db8ff;--blue:#6ea0ff;
  --brand-orange:#ff7a3d;--green:#4ade80;--green-bg:#0d3a2a;--red:#f87171;--red-bg:#471a1f;--amber:#fbbf24;--amber-bg:#44310d;
  --sky-bg:#10305a;--input:#0f1829;--th-bg:#22345e;--th-ink:#e8eefc;--shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
body.locked header,body.locked .navwrap,body.locked main,body.locked footer{display:none}

/* ---------- تسجيل الدخول ---------- */
.login{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;
  background:radial-gradient(900px 500px at 85% -10%,rgba(240,93,35,.35),transparent 60%),radial-gradient(800px 500px at -10% 110%,rgba(47,91,216,.55),transparent 60%),linear-gradient(160deg,#0f1f55 0%,#1e3a8a 55%,#16306f 100%)}
body.locked .login{display:flex}
.login-card{width:min(420px,100%);background:var(--card);border-radius:24px;padding:34px 30px 28px;box-shadow:0 30px 70px -15px rgba(0,0,0,.45);text-align:center;animation:rise .5s ease both}
.login-card.shake{animation:shake .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.login-logo{width:112px;height:112px;border-radius:50%;object-fit:cover;background:#fff;box-shadow:0 0 0 4px var(--bg),0 10px 25px -8px rgba(30,58,138,.4)}
.login-card h1{margin:16px 0 2px;font-size:25px;color:var(--navy);font-weight:800}
.login-card .sub{margin:0 0 22px;color:var(--muted);font-size:14px}
.login-card label{display:block;text-align:start;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px}
.login-card input{display:block;width:100%;margin-top:6px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--input);font-size:16px;transition:border-color .2s,box-shadow .2s}
.login-card input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(47,91,216,.15)}
.pw{position:relative}
.pw input{padding-inline-end:46px}
.pw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-35%);border:0;background:none;cursor:pointer;font-size:18px;padding:6px 8px;border-radius:8px;opacity:.7}
.pw button:hover{opacity:1;background:var(--bg)}
.login-err{min-height:22px;color:var(--red);font-weight:600;font-size:13.5px;margin:-4px 0 10px}
.btn.big{width:100%;justify-content:center;padding:12px 16px;font-size:16px;border-radius:12px}
.login-foot{margin-top:18px;font-size:12px;color:var(--muted)}

/* ---------- الهيدر ---------- */
header{background:var(--card);border-bottom:1px solid var(--line);position:relative}
header::before{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--navy),var(--blue) 55%,var(--brand-orange))}
.bar{max-width:1320px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.logo{margin-inline-end:auto;display:flex;align-items:center;gap:14px}
.logo img{height:52px;width:52px;object-fit:cover;border-radius:50%;border:1px solid var(--line);background:#fff}
.logo .ttl{display:flex;flex-direction:column;line-height:1.25}
.logo .ttl b{font-size:20px;font-weight:800;color:var(--navy)}
.logo .ttl small{font-size:12px;letter-spacing:.14em;color:var(--brand-orange);font-weight:700}
.user-chip{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;font-weight:800;font-size:15px}
[data-theme="dark"] .avatar{color:#0b1220;background:linear-gradient(135deg,#9db8ff,#6ea0ff)}
.uinfo{display:flex;flex-direction:column;line-height:1.2}
.uinfo b{font-size:14px}
.uinfo small{font-size:11px;color:var(--muted)}
.uinfo small.admin{color:var(--brand-orange);font-weight:700}
.filebar{max-width:1320px;margin:0 auto;padding:0 20px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg);margin-inline-end:auto}
.dot{width:10px;height:10px;border-radius:50%;background:#94a3b8}.dot.ok{background:var(--green)}.dot.warn{background:var(--amber)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 16px;cursor:pointer;font-weight:600;font-size:14px;transition:all .18s ease;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.primary{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-color:transparent}
.btn.primary:hover{color:#fff;box-shadow:0 8px 20px -6px rgba(47,91,216,.55)}
[data-theme="dark"] .btn.primary{color:#0b1220;background:linear-gradient(135deg,#9db8ff,#6ea0ff)}
[data-theme="dark"] .btn.primary:hover{color:#0b1220}
.btn.small{padding:4px 10px;font-size:13px;border-radius:9px}.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.theme-toggle{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.theme-toggle:hover{border-color:var(--blue)}

/* ---------- الإشعارات ---------- */
.notif-wrapper{position:relative}
.notif-btn{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px;transition:all .18s}
.notif-btn:hover{border-color:var(--brand-orange)}
.notif-badge{position:absolute;top:-7px;inset-inline-start:-7px;background:var(--brand-orange);color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;border:2px solid var(--card);box-shadow:0 2px 6px rgba(240,93,35,.45)}
.notif-dropdown{display:none;position:absolute;inset-inline-end:0;top:calc(100% + 10px);width:min(380px,calc(100vw - 32px));max-height:440px;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 45px -10px rgba(15,27,51,.3);z-index:100;padding:12px}
.notif-dropdown.show{display:block;animation:rise .2s ease both}
.notif-header{font-weight:700;color:var(--navy);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.notif-item{padding:10px;border-radius:10px;transition:background .15s;cursor:pointer;border-bottom:1px solid var(--line)}
.notif-item:hover{background:var(--bg)}
.notif-item:last-child{border-bottom:none}
.notif-title{font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.notif-time{font-size:11px;color:var(--muted);white-space:nowrap}
.notif-desc{font-size:12.5px;color:var(--muted);margin-top:3px}
.notif-by{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:12px;font-weight:700;color:var(--navy);background:var(--sky-bg);padding:2px 10px;border-radius:999px}

/* ---------- التنقل ---------- */
.navwrap{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
nav{max-width:1320px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav-links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
nav button.tab,.nav-links button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 16px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap;transition:all .18s ease;display:inline-flex;align-items:center;gap:8px}
.nav-links button:hover{color:var(--ink)}
.nav-links button.on{color:var(--navy);border-color:var(--brand-orange)}
.nav-links button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:1320px;margin:0 auto;padding:22px 20px 40px}

/* ---------- كروت ولوحات ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}
.kpi{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;border:1px solid var(--line);border-top:4px solid var(--navy);cursor:pointer;text-align:center;transition:transform .18s,box-shadow .18s}
.kpi:hover{transform:translateY(-3px);box-shadow:0 14px 28px -10px rgba(15,27,51,.2)}
.kpi .l{color:var(--muted);font-weight:600;font-size:14px}.kpi .v{font-size:34px;font-weight:800;line-height:1.2;margin:4px 0}.kpi .s{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:16px;margin-bottom:16px}
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-width:0;border:1px solid var(--line)}
.panel h3{margin:0 0 14px;font-size:17px;color:var(--navy);font-weight:700}
.search-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--card),var(--bg));border-radius:20px;box-shadow:var(--shadow);padding:40px 20px;text-align:center;margin-bottom:22px;border:1px solid var(--line)}
.search-hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;inset-inline-start:-80px;top:-100px;background:radial-gradient(circle,rgba(240,93,35,.18),transparent 70%);pointer-events:none}
.search-hero h2{margin:0 0 8px;color:var(--navy);font-size:25px;font-weight:800;position:relative}
.search-hero p{color:var(--muted);margin:0 0 22px;position:relative}
.search-box-lg{width:100%;max-width:660px;padding:15px 24px;font-size:16px;border:2px solid var(--line);border-radius:999px;background:var(--input);color:var(--ink);outline:none;box-shadow:0 8px 20px -8px rgba(47,91,216,.25);transition:all .2s;position:relative}
.search-box-lg:focus{box-shadow:0 10px 26px -8px rgba(47,91,216,.4);border-color:var(--blue)}
.stack{display:flex;height:26px;border-radius:999px;overflow:hidden;background:var(--line);margin-bottom:12px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px 20px;font-size:13px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-inline-end:6px}
.months{display:flex;gap:10px;align-items:flex-end;height:180px;padding-top:10px}
.months .m{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted)}
.months .col{width:65%;max-width:48px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:6px 6px 0 0;overflow:hidden}
.months .col i{display:block}

/* ---------- الجداول ---------- */
table{border-collapse:collapse;width:100%}
th{background:var(--th-bg);color:var(--th-ink);font-weight:600;font-size:13px;padding:12px 10px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px;text-align:center}
td.r{text-align:right}
td.det{max-width:320px;text-align:right;font-size:13px;color:var(--muted)}
tbody tr:hover td{filter:brightness(.97)}
tr.done td{background:var(--green-bg)}tr.late td{background:var(--red-bg)}tr.part td{background:var(--amber-bg)}tr.prep td{background:var(--sky-bg)}
tr.click{cursor:pointer}
.badge{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.b-done{background:var(--green);color:#fff}.b-new{background:#64748b;color:#fff}.b-part{background:#d97706;color:#fff}.b-prep{background:var(--blue);color:#fff}
[data-theme="dark"] .b-done,[data-theme="dark"] .b-part,[data-theme="dark"] .b-prep{color:#0b1220}
.by-tag{display:inline-block;font-size:12px;font-weight:700;color:var(--navy);background:var(--sky-bg);padding:2px 10px;border-radius:999px;white-space:nowrap}
tr.sky .by-tag,tr.prep .by-tag{background:var(--card)}
.alert{font-size:12px;color:var(--red);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;align-items:end;background:var(--card);padding:16px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line)}
.tools label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px;font-weight:600}
.tools input,.tools select{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--ink);min-width:140px}
.tools input:focus,.tools select:focus{outline:2px solid rgba(47,91,216,.35);border-color:var(--blue)}
.tools input.search{min-width:260px}
.tools .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px;padding-bottom:6px}
.tablewrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:auto;max-height:70vh;border:1px solid var(--line)}
.muted{color:var(--muted)}.count{font-weight:800;color:var(--navy);margin:0 4px}
.pager{display:flex;gap:10px;justify-content:center;align-items:center;padding:14px}

/* ---------- نافذة الإضافة ---------- */
dialog{border:0;border-radius:20px;padding:0;width:min(760px,95vw);max-height:92vh;background:var(--card);color:var(--ink);box-shadow:0 30px 60px -15px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,18,40,.6);backdrop-filter:blur(3px)}
dialog form{padding:24px 26px}
dialog h2{margin:0 0 4px;color:var(--navy);font-size:21px;font-weight:800}
.who{margin:0 0 16px;font-size:13px;color:var(--muted)}
.who b{color:var(--navy)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fgrid label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px;font-weight:600}
.fgrid .full{grid-column:1/-1}
.fgrid input,.fgrid select,.fgrid textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--input);font-size:15px;color:var(--ink);font-weight:400}
.fgrid input:focus,.fgrid select:focus,.fgrid textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,91,216,.15)}
.fgrid .delv{background:var(--green-bg);border-radius:12px;padding:14px;grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.actions{display:flex;gap:10px;justify-content:flex-start;margin-top:20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f1b33;color:#fff;padding:12px 24px;border-radius:12px;z-index:2000;box-shadow:0 12px 30px rgba(0,0,0,.35);max-width:90vw;font-weight:600;animation:rise .25s ease both}
.empty{padding:40px;text-align:center;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
footer{max-width:1320px;margin:0 auto;padding:0 20px 28px;text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:700px){
  .fgrid,.fgrid .delv{grid-template-columns:1fr}
  .bar{padding:10px 14px}.filebar{padding:0 14px 10px}nav{padding:0 8px}main{padding:16px 12px 30px}
  .logo{width:100%}.logo .ttl b{font-size:17px}
  .bar{gap:8px}
  .btn{padding:7px 11px;font-size:13px}.notif-btn{padding:7px 11px;font-size:13px}.theme-toggle{padding:7px 11px;font-size:13px}
  .user-chip{margin-inline-end:auto;padding:4px 12px 4px 5px}.avatar{width:30px;height:30px}
  .logo{margin-bottom:2px}
  .filebar{gap:6px}.chip{width:100%;justify-content:center;margin-bottom:2px}
  .filebar .btn{flex:1 1 auto;justify-content:center}
  .tools input.search{min-width:0;width:100%}.tools label{flex:1 1 140px}
  .search-hero{padding:28px 14px}.search-hero h2{font-size:20px}
  .login-card{padding:28px 20px 22px}
}
@media print{header,.navwrap,.tools,.pager,footer,.login{display:none!important}}

/* ===== v2: أبسط وأوضح ===== */
body{font-size:16px}
.btn{min-height:40px}
.btn.add{background:linear-gradient(135deg,var(--brand-orange),#ff8a4c);color:#fff;border-color:transparent;font-size:15px;font-weight:700;padding:9px 20px;box-shadow:0 8px 18px -8px rgba(240,93,35,.7)}
.btn.add:hover{color:#fff;box-shadow:0 12px 24px -8px rgba(240,93,35,.8)}
.bar{padding:10px 20px}
.bar .chip{margin-inline-end:0;cursor:pointer;padding:5px 12px}
.menu-wrap{position:relative}
.menu-wrap .user-chip{cursor:pointer;font-weight:inherit}
.menu-wrap .user-chip::after{content:"▾";color:var(--muted);font-size:12px;margin-inline-start:2px}
.menu{display:none;position:absolute;inset-inline-end:0;top:calc(100% + 10px);width:230px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 45px -10px rgba(15,27,51,.3);z-index:120;padding:8px}
.menu.show{display:block;animation:rise .18s ease both}
.menu .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;font-size:14.5px}
.menu .mi:hover{background:var(--bg)}
.menu .mi.danger{color:var(--red)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.menu .mh{padding:6px 12px;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.fab{display:none}
nav button.tab{}
.nav-links button{padding:14px 18px;font-size:15px}

/* الصفحة الرئيسية */
.cards.four{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi.ic{display:flex;align-items:center;gap:14px;text-align:start;padding:16px 18px}
.kpi.ic .ico{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--bg);flex:none}
.kpi.ic .v{font-size:30px;margin:0;line-height:1.1}
.kpi.ic .l{font-size:13.5px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}
.sec-title h3{margin:0;font-size:18px;color:var(--navy)}
.sec-title a{color:var(--blue);cursor:pointer;font-weight:700;font-size:14px}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.rc{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid #94a3b8;border-radius:12px;padding:12px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.rc:hover{transform:translateY(-2px)}
.rc.done{border-inline-start-color:var(--green)}.rc.late{border-inline-start-color:var(--red)}.rc.part{border-inline-start-color:var(--amber)}.rc.prep{border-inline-start-color:var(--blue)}
.rc-main{display:flex;justify-content:space-between;gap:8px;font-size:15.5px}
.rc-sub{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:6px}

/* السجل */
.quick{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.quick .search{flex:1 1 280px;padding:11px 18px;border:2px solid var(--line);border-radius:999px;background:var(--input);outline:none;font-size:15px}
.quick .search:focus{border-color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.fchip{border:1.5px solid var(--line);background:var(--card);padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);transition:all .15s}
.fchip:hover{border-color:var(--blue);color:var(--blue)}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
[data-theme="dark"] .fchip.on{color:#0b1220}
details.adv{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;box-shadow:var(--shadow)}
details.adv summary{cursor:pointer;padding:10px 16px;font-weight:700;color:var(--navy);list-style:none}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"⚙️ "}
details.adv .advbody{display:flex;flex-wrap:wrap;gap:12px;padding:4px 16px 16px;align-items:end}
details.adv label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:4px;font-weight:600}
details.adv input,details.adv select{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--input);min-width:150px}
.sub{display:block;font-size:12px;color:var(--muted);font-weight:400;line-height:1.4}
.rtable td{text-align:right;vertical-align:top}
.rtable td.c{text-align:center}
.rtable .acts{white-space:nowrap;text-align:center}
.rtable .acts .btn{margin:1px}
.btn.ok{background:var(--green);color:#fff;border-color:transparent}.btn.ok:hover{color:#fff;box-shadow:0 6px 14px -6px rgba(22,163,74,.6)}
[data-theme="dark"] .btn.ok{color:#0b1220}[data-theme="dark"] .btn.ok:hover{color:#0b1220}

/* نافذة الإضافة */
.fgrid h4.sec{grid-column:1/-1;margin:8px 0 0;font-size:14px;color:var(--navy);padding-bottom:6px;border-bottom:1px dashed var(--line)}
.fgrid h4.sec:first-child{margin-top:0}
.actions{position:sticky;bottom:0;background:var(--card);padding-top:14px;margin-top:16px;border-top:1px solid var(--line)}
.actions .btn{min-width:120px;justify-content:center}

@media (max-width:700px){
  body{font-size:15.5px}
  .bar .chip{width:auto;margin-bottom:0;padding:8px 11px}
  .bar .chip span#fileText{display:none}
  .bar>.btn.add{display:none}
  .bar .notif-btn .t{display:none}
  .user-chip{margin-inline-end:0}
  main{padding-bottom:96px}
  .bar .logo{width:100%}
  .fab{display:grid;place-items:center;position:fixed;bottom:18px;inset-inline-start:18px;width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--brand-orange),#ff8a4c);color:#fff;font-size:30px;box-shadow:0 12px 26px -6px rgba(240,93,35,.8);z-index:60;cursor:pointer}
  body.locked .fab{display:none}
  .kpi.ic{padding:12px}.kpi.ic .ico{width:42px;height:42px;font-size:20px}.kpi.ic .v{font-size:24px}
  .cards.four{grid-template-columns:1fr 1fr;gap:10px}
  .recent{grid-template-columns:1fr}
  .rtable thead{display:none}
  .rtable,.rtable tbody{display:block}
  .rtable tr{display:block;margin:0 0 12px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);background:var(--card)}
  .rtable tr.done{background:var(--green-bg)}.rtable tr.late{background:var(--red-bg)}.rtable tr.part{background:var(--amber-bg)}.rtable tr.prep{background:var(--sky-bg)}
  .rtable td{display:flex;justify-content:space-between;gap:12px;border:0!important;padding:5px 0;background:transparent!important;text-align:end!important;max-width:none}
  .rtable td::before{content:attr(data-label);color:var(--muted);font-weight:700;font-size:12.5px;flex:none}
  .rtable td.nolabel::before{display:none}
  .rtable td.acts{justify-content:center;padding-top:10px}
  .tablewrap{background:transparent;border:0;box-shadow:none;max-height:none}
  menu,.menu{width:min(260px,calc(100vw - 28px))}
}
</style>

function stats() {
  const R = state.records, total = R.length, done = R.filter(isDone).length;

  const t = todayISO();
  const months = [];

  const monthly = months.map(m => { const x = R.filter(r => r.date && r.date.startsWith(m)); const dn = x.filter(isDone).length; return { m, done: dn, pend: x.length - dn }; });
  const perCo = {};

  return {

    today: R.filter(r => r.ddate === t).length, monthly,

}

    if (f.st === 'pending' ? isDone(r) : f.st && r.status !== f.st) return false;

const dlg = $('#dlg'), frm = $('#frm');
function fillSelect(name, arr) { frm.elements[name].innerHTML = arr.map(x => `<option value="${esc(x)}">${esc(x) || '—'}</option>`).join(''); }
function openForm(rec, mode) {
  state.editing = rec ? rec.id : null;
  $('#dlCo').innerHTML = companies().map(c => `<option value="${esc(c)}">`).join('');
  $('#dlRep').innerHTML = repList().map(r => `<option value="${esc(r.name)}">`).join('');
  fillSelect('type', TYPES); fillSelect('pack', PACKS); fillSelect('status', STATUSES);
  const r = rec || { date: todayISO(), company: '', notice: '', type: '', pack: '', count: '', details: '', status: 'جديد', ddate: '', rep: '', phone: '', dnote: '' };
  for (const k of Object.keys(r)) if (frm.elements[k]) frm.elements[k].value = r[k] ?? '';
  if (mode === 'deliver') { frm.elements.status.value = 'تم التسليم'; frm.elements.ddate.value = todayISO(); }
  $('#dlgWho').innerHTML = !rec ? `سيتم تسجيل الإشعار باسم: <b>${esc(state.user ? state.user.name : '')}</b>` : (rec.by ? `أضافه: <b>${esc(rec.by)}</b>` : 'إشعار قديم بدون اسم مُضيف') + (rec.upd ? ` — آخر تعديل: <b>${esc(rec.upd)}</b>` : '');
  $('#dlgTitle').textContent = !rec ? 'إشعار جديد' : mode === 'deliver' ? 'تسجيل تسليم — ' + rec.company : 'تعديل إشعار — ' + rec.company;
  dlg.showModal(); setTimeout(() => frm.elements[mode === 'deliver' ? 'rep' : 'company'].focus(), 50);

frm.elements.rep.addEventListener('change', () => { const e = repList().find(r => r.name === frm.elements.rep.value); if (e && e.phone && !frm.elements.phone.value) frm.elements.phone.value = e.phone; });

frm.addEventListener('submit', e => {
  if (e.submitter && e.submitter.value !== 'ok') return;
  const v = Object.fromEntries(new FormData(frm).entries());
  const rec = { date: v.date, company: v.company.trim(), notice: v.notice.trim(), type: v.type, pack: v.pack, count: v.count === '' ? '' : Number(v.count), details: v.details.trim(), status: v.status, ddate: v.ddate, rep: v.rep.trim(), phone: v.phone.trim(), dnote: v.dnote.trim() };
  if (!rec.company || !rec.date) { e.preventDefault(); return toast('الشركة والتاريخ مطلوبين'); }
  
  if (state.editing) {
    Object.assign(state.records.find(r => r.id === state.editing), rec, { upd: state.user ? state.user.name : '', updAt: new Date().toISOString() });
  } else {
    state.records.push({ id: newId(), ...rec, by: state.user ? state.user.name : '', at: new Date().toISOString() });
    // زيادة عدد الإشعارات غير المقروءة عند إضافة سجل جديد
    state.unreadNotifs++;
    localStorage.setItem(UNREAD_KEY, state.unreadNotifs.toString());
  }
  
  touch(); setTimeout(render, 0);
});

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a],[data-v]'); if (!t) {
    if (e.target.id === 'themeToggleBtn') toggleTheme();
    return;
  }
  if (t.dataset.v) { state.view = t.dataset.v; return render(); }
  const a = t.dataset.a, id = +t.dataset.id, rec = state.records.find(r => r.id === id);
  if (a === 'logout') return doLogout();
  if (a === 'chip') { const v = t.dataset.k; state.f.st = ''; state.f.late = false; state.f.today = false; if (v === 'late') state.f.late = true; else state.f.st = v; state.page = 1; return render(); }
  if (!state.user) return;
  if (a === 'open') openFile(); else if (a === 'new') newFile(); else if (a === 'save') saveNow(); else if (a === 'reconnect') reconnect();
  else if (a === 'add') openForm(null); else if (a === 'edit') openForm(rec); else if (a === 'deliver') openForm(rec, 'deliver');
  else if (a === 'del') { if (!isAdmin()) return toast('الحذف متاح لمدير النظام فقط'); if (confirm(`تمسح إشعار ${rec.company}؟`)) { state.records = state.records.filter(r => r.id !== id); touch(); render(); } }
  else if (a === 'reset') { state.f = { q: '', co: '', st: '', rep: '', from: '', to: '', late: false }; state.page = 1; render(); }
  else if (a === 'pg') { state.page += +t.dataset.d; render(); }
  else if (a === 'coFilter') { state.f = { q: '', co: t.dataset.c, st: '', rep: '', from: '', to: '', late: false }; state.page = 1; state.view = 'reg'; render(); }
  else if (a === 'repFilter') { state.f = { q: '', co: '', st: '', rep: t.dataset.c, from: '', to: '', late: false }; state.page = 1; state.view = 'reg'; render(); }
  else if (a === 'rename') { const n = prompt('الاسم الجديد للشركة:', t.dataset.c); if (n && n.trim() && n.trim() !== t.dataset.c) { state.records.forEach(r => { if (r.company === t.dataset.c) r.company = n.trim(); }); touch(); render(); } }
  else if (a === 'gotoReg') { state.view = 'reg'; render(); }
  else if (a === 'gotoDash') { state.view = 'dash'; render(); }
  else if (a === 'gotoDone') { state.f = { q: '', co: '', st: 'تم التسليم', rep: '', from: '', to: '', late: false }; state.view = 'reg'; render(); }
  else if (a === 'gotoLate') { state.f = { q: '', co: '', st: '', rep: '', from: '', to: '', late: true }; state.view = 'reg'; render(); }
  else if (a === 'goto') {
    const g = t.dataset.g; state.f = { q: '', co: '', st: '', rep: '', from: '', to: '', late: false }; state.page = 1;
    if (g === 'done') state.f.st = 'تم التسليم'; if (g === 'pending') state.f.st = 'pending'; if (g === 'late') state.f.late = true; if (g === 'part') state.f.st = 'تسليم جزئي'; if (g === 'today') state.f.today = true;
    state.view = 'reg'; render();
  }
});

document.addEventListener('input', e => {
  const id = e.target.id, f = state.f; let redraw = true;
  if (id === 'quickSearchInput') { state.quickSearch = e.target.value; render(); const el = $('#quickSearchInput'); if(el){el.focus(); el.setSelectionRange(el.value.length, el.value.length);} return; }
  else if (id === 'fq') f.q = e.target.value; else if (id === 'fco') f.co = e.target.value; else if (id === 'fst') f.st = e.target.value; else if (id === 'frep') f.rep = e.target.value;

  else if (id === 'coq') state.coQ = e.target.value; else if (id === 'repq') state.repQ = e.target.value;

  const el = document.getElementById(id); if (el && el.type !== 'checkbox' && el.type !== 'date' && el.tagName === 'INPUT') { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
});

document.addEventListener('click', e => { const m = $('#userMenu'); if (m && (e.target.closest('.mi') || !e.target.closest('.menu-wrap'))) m.classList.remove('show'); });
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details.adv')) state.advOpen = e.target.open; }, true);
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveNow(); } });

/* ============================== تشغيل ============================== */
(function init() {
  let savedTheme = 'light';
  try { savedTheme = localStorage.getItem('returns_theme') || 'light'; } catch(e){}
  setTheme(savedTheme);

  let loaded = null;
  try { loaded = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  if (loaded && Array.isArray(loaded.records) && loaded.records.length) { state.records = loaded.records; state.late = loaded.late || 7; state.fileName = loaded.fileName || ''; }
  else { state.records = SEED.map(r => ({ ...r })); }
  state.records.forEach(r => { r.id = newId(); });

  state.unreadNotifs = parseInt(localStorage.getItem(UNREAD_KEY) || '0', 10);

  restoreSession(); applyUserUI();
  render();
  if (!state.user) setTimeout(() => $('#lgUser').focus(), 50);
})();
</script>
</body>
